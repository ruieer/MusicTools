name: Build exe

# Собирает самодостаточный MusicTools.exe (Python, yt-dlp, ffmpeg и ffprobe внутри).
# Запуск: вручную (Actions -> Build exe -> Run workflow) или тегом v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: ffmpeg и ffprobe в bin
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          Get-ChildItem ff -Recurse -Filter ffmpeg.exe  | Select-Object -First 1 | Copy-Item -Destination bin/ffmpeg.exe
          Get-ChildItem ff -Recurse -Filter ffprobe.exe | Select-Object -First 1 | Copy-Item -Destination bin/ffprobe.exe
          Get-Item bin/ffmpeg.exe, bin/ffprobe.exe | Select-Object Name, Length

      - name: Сборка
        run: python -m PyInstaller --noconfirm --clean MusicTools.spec

      - uses: actions/upload-artifact@v4
        with:
          name: MusicTools-exe
          path: dist/MusicTools.exe

      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/MusicTools.exe \
              --notes-file "$notes" --title "Music Tools $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" dist/MusicTools.exe \
              --generate-notes --title "Music Tools $GITHUB_REF_NAME"
          fi
